name: Daily SSC Current Affairs Digest

on:
  schedule:
    # 06:30 IST = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-digest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest

    outputs:
      state_sha: ${{ steps.history.outputs.state_sha }}
      weekday: ${{ steps.calendar.outputs.weekday }}
    steps:
      - name: Check IST report date
        id: calendar
        run: |
          echo "weekday=$(TZ=Asia/Kolkata date +%u)" >> "$GITHUB_OUTPUT"

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily SSC digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/main.py

      - name: Save deduplication state
        id: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          touch data/seen_titles.json data/weekly_items.json
          git add -f data/seen_titles.json data/weekly_items.json
          git diff --staged --quiet || git commit -m "Update seen_titles.json / weekly_items.json [skip ci]"
          if ! git push; then
            echo "::error::Digest step completed but history could not be pushed. Check delivery before rerunning."
            exit 1
          fi
          echo "state_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Digest history is up to date." >> "$GITHUB_STEP_SUMMARY"
  sunday-report:
    needs: send-digest
    if: github.event_name == 'schedule' && needs.send-digest.outputs.weekday == '7'
    uses: ./.github/workflows/weekly_report.yml
    with:
      state_ref: ${{ needs.send-digest.outputs.state_sha }}
    secrets: inherit
