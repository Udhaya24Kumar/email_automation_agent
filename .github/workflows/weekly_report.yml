name: Weekly SSC Current Affairs Report

on:
  workflow_call:
    inputs:
      state_ref:
        type: string
        required: true
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.state_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PDF fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core

      - name: Render weekly report
        run: python scripts/weekly_report.py --preview data/weekly_report.pdf

      - name: Send weekly report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python scripts/weekly_report.py --attachment data/weekly_report.pdf
